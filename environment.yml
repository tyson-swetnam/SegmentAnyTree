# Conda environment for SegmentAnyTree local development.
# Creates the base env; PyTorch + GPU libs installed via pip (see docs/local-build.md).
#
# Usage:
#   mamba env create -f environment.yml
#   # Then follow docs/local-build.md for PyTorch + GPU library installation
name: sat
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pdal
  - cmake
  - ninja
  - git
  - pip
