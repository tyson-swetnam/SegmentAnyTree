name: sat
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy<2
  - scipy
  - cython
  - cmake
  - ninja
  - git
  - openblas
  - sparsehash

  # PyTorch + CUDA 11.8
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8

  # PyTorch Geometric
  - pyg=2.5.*

  # PDAL for COPC output
  - pdal

  # Python dependencies
  - pip
  - pip:
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - tqdm
    - pandas
    - scikit-learn
    - scikit-image
    - matplotlib
    - seaborn
    - h5py
    - plyfile
    - "laspy[lazrs]"
    - open3d
    - gdown
    - numba
    - joblib
    - dask
    - pykdtree
    - jaklas
    - pytorch-metric-learning
    - addict
    - python-louvain
    - hdbscan
    - jupyterlab>=4.0
    - ipywidgets
