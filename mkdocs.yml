site_name: SegmentAnyTree
site_description: Deep learning framework for tree instance segmentation from 3D LiDAR point clouds
site_author: Wielgosz et al.
site_url: https://tyson-swetnam.github.io/SegmentAnyTree/

repo_name: tyson-swetnam/SegmentAnyTree
repo_url: https://github.com/tyson-swetnam/SegmentAnyTree

copyright: "Copyright &copy; 2024 Principia Labs Ltd. BSD License."

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: quickstart.md
    - Docker Guide: docker.md
    - Local Build: local-build.md
    - HPC / Singularity: singularity.md
  - User Guide:
    - Scientific Workflow: workflow.md
    - Inference: inference.md
    - Training: training.md
    - Notebooks: notebooks.md
    - Example Data: example-data.md
  - Reference:
    - Architecture: architecture.md
    - Troubleshooting: troubleshooting.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tyson-swetnam/SegmentAnyTree
